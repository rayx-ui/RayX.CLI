[package]
name = "rayx-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "The RayX command-line tool: machine setup, doctor, WSL, self update and the app pipeline for any RayX app."
license = "Apache-2.0"
repository = "https://github.com/rayx-ui/RayX.CLI"
readme = "README.md"
publish = false

[lib]
name = "rayx_cli"
path = "src/lib.rs"

[[bin]]
name = "rayx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1"
tempfile = "3.27.0"
toml = "0.9"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"
