[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-pc-windows-msvc", "x86_64-pc-windows-msvc", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Checksums to generate for each App
checksum = "sha256"
# Path that installers should place binaries in
install-path = ["$RAYX_HOME/bin", "~/.rayx/bin"]
# Which actions to run on pull requests
pr-run-mode = "upload"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Publish GitHub artifact attestations (Sigstore provenance) for every artifact
github-attestations = true

[dist.github-custom-runners.aarch64-pc-windows-msvc]
runner = "windows-2022"
host = "x86_64-pc-windows-msvc"
