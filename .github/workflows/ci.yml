name: CI

# Runs on pull requests only (opened, new commits, reopened), never on pushes: a branch with an open
# pull request would run twice and a merge would run again on the base branch. `workflow_dispatch`
# runs it by hand on any branch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6

      # Reads rust-toolchain.toml (1.95.0 with clippy and rustfmt) and caches the cargo registry
      # and target directory.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # The tests that build for real: the threaded WebAssembly fixture and the generated Playwright
  # package. They need the web and test sets, which `rayx setup` installs.
  web:
    name: web tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install the web and test sets
        run: cargo run --release -- setup --web --test --yes

      - name: Test
        run: cargo test --test app_wasm_fixture --test app_playwright_template -- --include-ignored

  # `rayx setup` for real on each host family, then `--check` must find nothing missing: the
  # installers (apt, Homebrew, winget) are only ever proven on a machine that lacks the tools.
  setup:
    name: setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build rayx
        run: cargo build --release

      - name: Doctor before
        run: ./target/release/rayx doctor
        shell: bash

      - name: Setup (base and web sets)
        run: ./target/release/rayx setup --web --yes
        shell: bash

      - name: Setup finds nothing missing
        run: ./target/release/rayx setup --check --web
        shell: bash

      - name: Doctor after
        run: ./target/release/rayx doctor --json
        shell: bash
