name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml (1.95.0 with clippy and rustfmt) and caches the cargo registry
      # and target directory.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # The tests that build for real: the threaded WebAssembly fixture and the generated Playwright
  # package. They need the web and test sets, which `rayx setup` installs.
  web:
    name: web tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install the web and test sets
        run: cargo run --release -- setup --web --test --yes

      - name: Test
        run: cargo test --test app_wasm_fixture --test app_playwright_template -- --include-ignored
